<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -150 300 300">
  <title>Matriz Central</title>
  <!-- Cubo isométrico flat em 3 tons de violeta: topo #a78bfa, esquerda #7c5cff, direita #7c3aed -->
  <!-- Geometry: hexágono com R=140 para legibilidade em 16px -->
  <polygon points="-121.24,-70 0,-140 121.24,-70 0,0" fill="#a78bfa"/>
  <polygon points="-121.24,-70 0,0 0,140 -121.24,70" fill="#7c5cff"/>
  <polygon points="0,0 121.24,-70 121.24,70 0,140" fill="#7c3aed"/>
</svg>
